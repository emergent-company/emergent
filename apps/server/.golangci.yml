version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - all
        path: docs/swagger/
      - linters:
          - all
        path: migrations/
      # Swiftbridge goXxx functions are called by the CGO export layer (bridge.go),
      # which is excluded when building without cgo — `unused` false-positives.
      - linters:
          - unused
        path: cmd/swiftbridge/
      # Swiftbridge uses an async cgo callback pattern (defer inside goroutines)
      # that SA9010 flags as "deferred return function not called" — false positives.
      - linters:
          - staticcheck
        path: cmd/swiftbridge/
        text: "SA9010"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
